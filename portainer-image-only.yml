# Alternative when local/osint-spiderfoot:portainer was already built on this host.
# Not for the existing spiderfoot:latest stack unless its image was changed intentionally.
services:
  spiderfoot:
    image: local/osint-spiderfoot:portainer
    restart: unless-stopped
    command: ["python", "sf.py", "-l", "0.0.0.0:18894"]
    ports:
      - "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}:${SPIDERFOOT_HOST_PORT:-18894}:18894/tcp"
    security_opt:
      - no-new-privileges:true
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot

volumes:
  spiderfoot-data:
