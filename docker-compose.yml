# IT-MANAGER: SpiderFoot LAN deployment on 18994/TCP.
# This is the default docker-compose.yml used by existing Portainer Git stacks.
# The original SpiderFoot service/image/container name and named data volume are preserved.
# IMPORTANT: verify host port 18994 is free before updating a running stack.
services:
  spiderfoot:
    build:
      context: .
    image: spiderfoot
    container_name: spiderfoot
    restart: unless-stopped
    command: ["sf.py", "-l", "0.0.0.0:18994"]
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - spiderfoot
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}:${SPIDERFOOT_HOST_PORT:-18994}:80/tcp"
    environment:
      AUTH_USER: "${OSINT_AUTH_USER:?SET_LOGIN_NAME}"
      AUTH_PASSWORD: "${OSINT_AUTH_PASSWORD:?SET_LOGIN_PASSWORD}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        HASH=$$(caddy hash-password --algorithm bcrypt --plaintext "$$AUTH_PASSWORD")
        printf '%s\n' ':80 {' '  basic_auth {' "    $$AUTH_USER $$HASH" '  }' '  reverse_proxy spiderfoot:18994' '}' > /etc/caddy/Caddyfile
        caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  spiderfoot-data:
