# Optional new deployment: build SpiderFoot from this fork using Dockerfile.portainer.
# Existing running stack should use docker-compose.yml, NOT this build version.
services:
  spiderfoot:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    image: local/osint-spiderfoot:portainer
    restart: unless-stopped
    environment:
      OSINT_AUTH_USER: "${OSINT_AUTH_USER:?SET_LOGIN_NAME}"
      OSINT_AUTH_PASSWORD: "${OSINT_AUTH_PASSWORD:?SET_LOGIN_PASSWORD}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf '%s:%s\n' "$$OSINT_AUTH_USER" "$$OSINT_AUTH_PASSWORD" > /var/lib/spiderfoot/passwd
        exec python sf.py -l 0.0.0.0:18894
    ports:
      - "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}:${SPIDERFOOT_HOST_PORT:-18894}:18894/tcp"
    security_opt:
      - no-new-privileges:true
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot

volumes:
  spiderfoot-data:
