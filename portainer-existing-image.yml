# Web editor / image-only fallback for EXISTING stack spiderfoot.
# No git build or proxy, no extra image.
# Keep current stack name "spiderfoot" to preserve project volume.
services:
  spiderfoot:
    image: spiderfoot:latest
    container_name: spiderfoot
    restart: unless-stopped
    command: ["sf.py", "-l", "0.0.0.0:18894"]
    ports:
      - "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}:${SPIDERFOOT_HOST_PORT:-18894}:18894/tcp"
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    security_opt:
      - no-new-privileges:true

volumes:
  spiderfoot-data:
