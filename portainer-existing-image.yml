# For Portainer Web editor: NO Git clone and NO Docker build.
# Use ONLY on the Docker endpoint already containing image 'spiderfoot:latest'.
# Preserves the original Docker Compose volume name spiderfoot_spiderfoot-data
# if existing Portainer Stack name remains exactly 'spiderfoot'.
# NEVER create a second stack with the same container_name as a running one.
services:
  spiderfoot:
    image: spiderfoot:latest
    container_name: spiderfoot
    restart: unless-stopped
    command: ["sf.py", "-l", "0.0.0.0:18994"]
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - spiderfoot
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}:${SPIDERFOOT_HOST_PORT:-18994}:80/tcp"
    environment:
      AUTH_USER: "${OSINT_AUTH_USER:?SET_LOGIN_NAME}"
      AUTH_PASSWORD: "${OSINT_AUTH_PASSWORD:?SET_LOGIN_PASSWORD}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        HASH=$$(caddy hash-password --algorithm bcrypt --plaintext "$$AUTH_PASSWORD")
        printf '%s\n' ':80 {' '  basic_auth {' "    $$AUTH_USER $$HASH" '  }' '  reverse_proxy spiderfoot:18994' '}' > /etc/caddy/Caddyfile
        caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  spiderfoot-data:
